name: Build 5broz APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Rename APK
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk 5broz.apk
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing password configured - compiled only, not published."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to Release (stable direct link)
        if: steps.apk.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 5broz latest APK
          files: 5broz.apk

      # On failure, publish the log so it can be read without signing in.
      - name: Publish build log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI build log
          prerelease: true
          files: build.log

  # Real-network test of the built-in torrent engine (magnet -> stream -> seek).
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Stream a real torrent through the engine
        env:
          RUN_ENGINE_TEST: '1'
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew :torrent:test --no-daemon 2>&1 | tee engine-test.log
      - name: Publish engine test log
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-log
          name: CI build log
          prerelease: true
          files: engine-test.log
