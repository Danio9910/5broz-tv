name: Smoothness (frame times per screen)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'ci/jank.sh', 'ci/trace_top.py', '.github/workflows/jank.yml' ]

permissions:
  contents: write

jobs:
  jank:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        mode: [phone, tablet, tv]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build optimised 5broz (bench)
        run: chmod +x ./gradlew && ./gradlew assembleBench --no-daemon
      - run: pip install perfetto==0.11.0
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Phone / tablet
        if: matrix.mode != 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.mode == 'phone' && 'pixel_5' || 'pixel_c' }}
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: MODE=${{ matrix.mode }} APK=app/build/outputs/apk/bench/app-bench.apk timeout 1800 ./ci/jank.sh || true
      - name: TV
        if: matrix.mode == 'tv'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86
          target: android-tv
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: MODE=tv APK=app/build/outputs/apk/bench/app-bench.apk timeout 1800 ./ci/jank.sh || true
      - name: Analyse trace
        if: always()
        run: |
          [ -f jank-${{ matrix.mode }}/home.pftrace ] && python3 ci/trace_top.py jank-${{ matrix.mode }}/home.pftrace > jank-${{ matrix.mode }}/trace-top.txt 2>&1 || true
          find jank-* -type f -size 0 -delete || true
      - uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ci-jank-${{ matrix.mode }}
          name: Smoothness (${{ matrix.mode }})
          prerelease: true
          files: jank-${{ matrix.mode }}/*
